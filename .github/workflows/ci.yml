name: CI Quality, Security & Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-attendance-system/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest test suite
        run: |
          pytest --verbose

  frontend-build:
    name: Frontend Accessibility, Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-attendance-system/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ai-attendance-system/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Production bundle build
        run: npm run build
